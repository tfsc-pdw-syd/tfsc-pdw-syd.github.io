<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TFSC PDW 2026 — Screen Display</title>
<style>
@page { size: 13.333in 7.5in; margin: 0; }

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --brand:      #b71c1c;
  --brand-deep: #7f1212;
  --ink:        #1a1a20;
  --soft:       #52525f;
  --border:     #d8d8e0;
  --white:      #ffffff;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}

html, body {
  height: 100%;
  background: #000;
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* Letterboxed 16:9 stage that fills any viewport size/shape */
.stage {
  position: relative;
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.frame {
  position: relative;
  width: 100vw;
  height: 56.25vw;      /* 16:9 */
  max-width: 177.78vh;  /* 16:9 */
  max-height: 100vh;
  background: var(--white);
  overflow: hidden;
  container-type: size;
  container-name: frame;
}

@container frame (min-width: 0) {
  .red {
    position: absolute;
    inset: 0;
    width: 58%;
    height: 100%;
    background: var(--brand);
    clip-path: polygon(0 0, 100% 0, 86% 100%, 0 100%);
    overflow: hidden;
  }

  .red__dots {
    position: absolute;
    inset: -10%;
    background-image: radial-gradient(rgba(255,255,255,.20) 1.4px, transparent 1.4px);
    background-size: 3.4cqw 3.4cqw;
  }

  .red__ring {
    position: absolute;
    border: 1px solid rgba(255,255,255,.16);
    border-radius: 50%;
  }
  .red__ring--a { width: 34cqw; height: 34cqw; left: -12cqw; top: -14cqw; }
  .red__ring--b { width: 26cqw; height: 26cqw; left: -8cqw; bottom: -12cqw; }

  .red__eyebrow {
    position: absolute;
    top: 7.5cqh;
    left: 6cqw;
    font-size: 1.15cqw;
    font-weight: 700;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: rgba(255,255,255,.75);
  }

  .red__title {
    position: absolute;
    left: 6cqw;
    bottom: 15cqh;
    color: var(--white);
  }
  .red__title .line1 {
    font-size: 8.6cqw;
    font-weight: 800;
    letter-spacing: -.01em;
    line-height: 1;
  }
  .red__title .line2 {
    font-size: 5.6cqw;
    font-weight: 300;
    color: rgba(255,255,255,.55);
    line-height: 1;
    margin-top: .5cqh;
  }

  /* ── Right column ── */
  .right {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 60%;
    right: 5.5cqw;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 9cqh 0 6cqh;
  }

  .meta-block .meta + .meta { margin-top: 3cqh; }
  .meta-eyebrow {
    font-size: 1cqw;
    font-weight: 700;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--brand);
    margin-bottom: .8cqh;
  }
  .meta-value {
    font-size: 2.5cqw;
    font-weight: 800;
    color: var(--ink);
    letter-spacing: -.01em;
    line-height: 1.15;
  }
  .meta-rule {
    height: 1px;
    background: var(--border);
    margin: 3cqh 0;
  }

  .bottom-row {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 2cqw;
  }

  .slides-note {
    font-size: 1.7cqw;
    line-height: 1.5;
    color: var(--ink);
    width: 22cqw;
    flex-shrink: 0;
    overflow-wrap: anywhere;
  }
  .slides-note a {
    color: var(--brand);
    font-weight: 700;
    text-decoration: none;
  }

  .qr-block { width: 10cqw; text-align: center; flex-shrink: 0; }
  .qr-eyebrow {
    font-size: 1cqw;
    font-weight: 700;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--brand);
    margin-bottom: 1cqh;
  }
  .qr-box {
    width: 10cqw;
    height: 10cqw;
    padding: .7cqw;
    border: 1.5px solid var(--border);
    border-radius: .6cqw;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .qr-box svg { width: 100%; height: 100%; display: block; }
  .qr-url {
    margin-top: 1cqh;
    font-size: .85cqw;
    color: var(--soft);
    letter-spacing: .01em;
  }
}

@media print {
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  html, body { background: var(--white); overflow: visible; }
  .stage { width: 13.333in; height: 7.5in; }
  .frame { width: 13.333in; height: 7.5in; max-width: none; max-height: none; }
}
</style>
</head>
